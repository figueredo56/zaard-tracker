<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAKER ZARD | Global On-Chain Suite</title>
    
    <!-- Metaetiquetas Open Graph -->
    <meta property="og:title" content="TRAKER ZARD | Protocolo Oficial 🚀">
    <meta property="og:description" content="Monitoreo Técnico On-Chain en Tiempo Real. Ecosistema ZAARD.">
    <meta property="og:image" content="https://raw.githubusercontent.com/figueredo56/zaard-tracker/refs/heads/main/184%20sin%20t%C3%ADtulo_20260715225022.png">
    <meta property="og:url" content="https://figueredo56.github.io/zaard-tracker/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="TRAKER ZARD | Protocolo Oficial">
    <meta name="twitter:description" content="Monitoreo On-Chain Next-Gen con soporte multilingüe.">
    <meta name="twitter:image" content="https://raw.githubusercontent.com/figueredo56/zaard-tracker/refs/heads/main/184%20sin%20t%C3%ADtulo_20260715225022.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            cyan: '#00ffff',
                            purple: '#a855f7',
                            emerald: '#22c55e',
                            darkBg: '#050014'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #0d001a 0%, #030008 50%, #001226 100%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 12px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes triColorGlow {
            0% {
                border-color: #00ffff;
                box-shadow: 0 0 25px rgba(0, 255, 255, 0.35), inset 0 0 15px rgba(0, 255, 255, 0.1);
            }
            33% {
                border-color: #22c55e;
                box-shadow: 0 0 30px rgba(34, 197, 94, 0.4), inset 0 0 15px rgba(34, 197, 94, 0.1);
            }
            66% {
                border-color: #a855f7;
                box-shadow: 0 0 35px rgba(168, 85, 247, 0.45), inset 0 0 20px rgba(168, 85, 247, 0.15);
            }
            100% {
                border-color: #00ffff;
                box-shadow: 0 0 25px rgba(0, 255, 255, 0.35), inset 0 0 15px rgba(0, 255, 255, 0.1);
            }
        }

        .main-frame {
            border: 2px solid #00ffff;
            border-radius: 20px;
            background: rgba(6, 4, 15, 0.96);
            backdrop-filter: blur(14px);
            animation: triColorGlow 6s infinite ease-in-out;
            width: 100%;
            max-width: 520px;
        }

        .title-gradient {
            background: linear-gradient(135deg, #00ffff 0%, #a855f7 50%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .space-nebula-bg {
            background: radial-gradient(circle at 50% 30%, #3b0764 0%, #1e1b4b 60%, #030712 100%);
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #030008;
        }
        ::-webkit-scrollbar-thumb {
            background: #a855f7;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="main-frame p-4 sm:p-5 my-3 shadow-2xl flex flex-col items-center">
        
        <!-- 1. IMAGEN PRINCIPAL ARRIBA (Bella y Redonda con brillo) -->
        <div class="w-28 h-28 sm:w-32 sm:h-32 mb-3 rounded-full p-1 bg-gradient-to-tr from-cyan-500 via-purple-500 to-emerald-400 shadow-[0_0_20px_rgba(0,255,255,0.4)] flex items-center justify-center">
            <img src="https://raw.githubusercontent.com/figueredo56/zaard-tracker/refs/heads/main/184%20sin%20t%C3%ADtulo_20260715225022.png" alt="Logo ZARD" class="w-full h-full object-cover rounded-full bg-black">
        </div>

        <!-- 2. TÍTULO Y SELECTOR DE IDIOMA -->
        <div class="text-center w-full mb-4">
            <h1 class="text-2xl sm:text-3xl font-extrabold title-gradient uppercase tracking-wider" data-i18n="mainTitle">TRAKER ZARD</h1>
            <p class="text-xs text-cyan-200 mt-0.5 font-medium" data-i18n="mainSubtitle">Monitoreo On-Chain - Ecosistema ZAARD</p>
            
            <!-- Selector de Idioma -->
            <div class="flex justify-center items-center gap-1.5 mt-3">
                <div class="flex items-center gap-1 bg-black/70 border border-cyan-500/40 rounded-xl p-1 shadow-inner">
                    <button onclick="changeLanguage('es')" id="btn-es" class="px-2.5 py-0.5 text-[11px] font-bold rounded-lg transition-all bg-cyan-500 text-black shadow-[0_0_6px_rgba(0,255,255,0.6)]">ES</button>
                    <button onclick="changeLanguage('en')" id="btn-en" class="px-2.5 py-0.5 text-[11px] font-bold rounded-lg transition-all text-gray-400 hover:text-white">EN</button>
                    <button onclick="changeLanguage('ar')" id="btn-ar" class="px-2.5 py-0.5 text-[11px] font-bold rounded-lg transition-all text-gray-400 hover:text-white">AR</button>
                    <button onclick="changeLanguage('zh')" id="btn-zh" class="px-2.5 py-0.5 text-[11px] font-bold rounded-lg transition-all text-gray-400 hover:text-white">ZH</button>
                </div>
            </div>
        </div>

        <!-- 3. EL TRACKER: GRÁFICA DE VELAS EN VIVO -->
        <div class="w-full border border-cyan-500/40 rounded-xl p-3 bg-black/85 mb-3 shadow-lg">
            <div class="flex justify-between items-center border-b border-cyan-500/20 pb-2 mb-2">
                <h2 class="text-cyan-400 font-bold text-xs flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                    <span data-i18n="liveChartTitle">Gráfica / Velas en Vivo</span>
                </h2>
                <span class="text-[10px] text-green-400 bg-green-950/60 border border-green-500/40 px-2 py-0.5 rounded-full font-semibold" data-i18n="synced">● Sincronizado</span>
            </div>
            <div class="w-full h-[260px] sm:h-[280px] rounded-lg overflow-hidden border border-cyan-500/30 bg-black">
                <iframe id="dexscreener-iframe" src="" width="100%" height="100%" style="border:0;"></iframe>
            </div>
        </div>

        <!-- 4. LOGO PEQUEÑO CON ETIQUETA PARA IR AL TOKEN EN WEB3 DE BINANCE -->
        <a id="token-link" href="#" target="_blank" class="w-full rounded-xl border border-purple-400/50 p-3 space-nebula-bg flex items-center justify-between group hover:border-cyan-400 transition-all shadow-md mb-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full border border-cyan-400 p-0.5 bg-black flex items-center justify-center shrink-0 shadow-[0_0_8px_rgba(0,255,255,0.6)]">
                    <img src="https://raw.githubusercontent.com/figueredo56/zaard-tracker/refs/heads/main/184%20sin%20t%C3%ADtulo_20260715225022.png" alt="ZARD" class="w-full h-full object-cover rounded-full">
                </div>
                <div class="flex flex-col text-left">
                    <span class="text-xs font-bold text-cyan-200" data-i18n="officialToken">Token Oficial ZARD</span>
                    <span class="text-[10px] text-gray-300">Binance Web3 Suite</span>
                </div>
            </div>
            <span class="bg-gradient-to-r from-cyan-500 to-purple-600 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg shadow group-hover:scale-105 transition-all whitespace-nowrap" data-i18n="goToToken">Ir al Token 🚀</span>
        </a>

        <!-- 5. COMPRAS Y VENTAS (SWAP STREAM) BIEN ESTILIZADO -->
        <div class="w-full border border-cyan-500/40 rounded-xl p-3 bg-black/85 shadow-lg mb-2">
            <div class="flex justify-between items-center border-b border-cyan-500/20 pb-2 mb-2">
                <h3 class="text-cyan-400 font-bold text-xs uppercase tracking-wide flex items-center gap-1.5">
                    <span>📊</span> <span data-i18n="ordersTitle">Órdenes y Swaps en Vivo</span>
                </h3>
                <span class="text-[10px] text-green-400 bg-green-950/60 border border-green-500/40 px-2 py-0.5 rounded-full font-semibold animate-pulse" data-i18n="liveStatus">● En Vivo</span>
            </div>
            
            <a id="dexscreener-stream-link" href="#" target="_blank" class="w-full rounded-lg border border-purple-500/40 space-nebula-bg flex items-center justify-between p-3 group hover:border-cyan-400 transition-all text-left">
                <span class="text-cyan-200 text-xs font-bold" data-i18n="dexscreenerAction">Ver historial completo de compras y ventas</span>
                <span class="bg-cyan-500 text-black text-[11px] font-bold px-3 py-1 rounded-md shadow group-hover:scale-105 transition-all whitespace-nowrap" data-i18n="openRegistry">Abrir 📈</span>
            </a>
        </div>

        <!-- Pie de página -->
        <footer class="w-full mt-2 text-center text-[10px] text-gray-400 border-t border-cyan-500/20 pt-2 flex flex-col sm:flex-row justify-between items-center gap-1">
            <span>TRAKER ZARD &copy; 2026 - ZAARD INNOVATION</span>
            <span class="text-cyan-400 font-mono">Secure On-Chain Environment</span>
        </footer>

    </div>

    <script>
        const translations = {
            es: {
                mainTitle: "TRAKER ZARD",
                mainSubtitle: "Monitoreo On-Chain - Ecosistema ZAARD",
                liveChartTitle: "Gráfica / Velas en Vivo",
                synced: "● Sincronizado",
                officialToken: "Token Oficial ZARD",
                goToToken: "Ir al Token 🚀",
                ordersTitle: "Órdenes y Swaps en Vivo",
                liveStatus: "● En Vivo",
                dexscreenerAction: "Ver historial completo de compras y ventas",
                openRegistry: "Abrir 📈"
            },
            en: {
                mainTitle: "TRAKER ZARD",
                mainSubtitle: "On-Chain Monitoring - ZAARD Ecosystem",
                liveChartTitle: "Live Chart / Candles",
                synced: "● Synced",
                officialToken: "Official ZARD Token",
                goToToken: "Go to Token 🚀",
                ordersTitle: "Live Orders & Swaps",
                liveStatus: "● Live",
                dexscreenerAction: "View complete buy & sell transaction history",
                openRegistry: "Open 📈"
            },
            ar: {
                mainTitle: "تراكر زارد",
                mainSubtitle: "مراقبة سلسة - نظام زارد",
                liveChartTitle: "الرسم البياني المباشر",
                synced: "● متزامن",
                officialToken: "رمز زارد الرسمي",
                goToToken: "اذهب إلى الرمز 🚀",
                ordersTitle: "الطلبات والمقايضات المباشرة",
                liveStatus: "● مباشر",
                dexscreenerAction: "عرض سجل معاملات البيع والشراء بالكامل",
                openRegistry: "فتح 📈"
            },
            zh: {
                mainTitle: "扎ード トラッカー",
                mainSubtitle: "链上监控 - 扎ード生态系统",
                liveChartTitle: "实时图表 / K线",
                synced: "● 已同步",
                officialToken: "官方代币 ZARD",
                goToToken: "前往代币 🚀",
                ordersTitle: "实时订单与兑换",
                liveStatus: "● 实时",
                dexscreenerAction: "查看完整的买卖交易历史",
                openRegistry: "打开 📈"
            }
        };

        function changeLanguage(lang) {
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            if (lang === 'ar') {
                document.documentElement.setAttribute('dir', 'rtl');
            } else {
                document.documentElement.setAttribute('dir', 'ltr');
            }

            ['es', 'en', 'ar', 'zh'].forEach(l => {
                const btn = document.getElementById(`btn-${l}`);
                if (btn) {
                    if (l === lang) {
                        btn.className = "px-2.5 py-0.5 text-[11px] font-bold rounded-lg transition-all bg-cyan-500 text-black shadow-[0_0_6px_rgba(0,255,255,0.6)]";
                    } else {
                        btn.className = "px-2.5 py-0.5 text-[11px] font-bold rounded-lg transition-all text-gray-400 hover:text-white";
                    }
                }
            });

            localStorage.setItem('zaard_lang', lang);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('zaard_lang') || 'es';
            changeLanguage(savedLang);
        });

        const ZARD_CONTRACT = "0x5cac292558049638f39fb492e70fdbf3c4f5eb4e";
        const PANCAKE_POOL = "0x5cac292558049638f39fb492e70fdbf3c4f5eb4e";

        document.getElementById('token-link').href = `https://app.binance.com/uni-qr/web3-token-details?utm_medium=share&tokenCA=${ZARD_CONTRACT}&binanceChainId=56&chain=bsc`;
        document.getElementById('dexscreener-iframe').src = `https://dexscreener.com/bsc/${PANCAKE_POOL}?embed=1&theme=dark&trades=0&info=0`;
        document.getElementById('dexscreener-stream-link').href = `https://dexscreener.com/bsc/${PANCAKE_POOL}`;
    </script>
</body>
</html>
